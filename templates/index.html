<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Caixa Mensal</title>

<style>
body {
    font-family: Arial;
    background: #1e1e2f;
    color: white;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #2c2c3e;
}

th, td {
    border: 1px solid #444;
    padding: 6px;
    text-align: center;
}

th {
    background: #444;
}

input {
    width: 80px;
    padding: 5px;
    border-radius: 5px;
    border: none;
}

button {
    margin: 20px;
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>📊 Controle de Caixa - Abril 2024</h1>

<form method="POST" action="/salvar">

<table>
<tr>
    <th>Dia</th>
    <th>Semana</th>
    <th>Data</th>
    <th>Dinheiro</th>
    <th>Pix</th>
    <th>Crédito</th>
    <th>Débito</th>
    <th>Sangria</th>
    <th>Total</th>
</tr>

{% for d in dias %}
<tr>
    <td>{{ d.dia }}</td>
    <td>{{ d.semana }}</td>
    <td>{{ d.data }}</td>

    <td><input name="dinheiro{{d.dia}}" value="{{ d.dinheiro }}"></td>
    <td><input name="pix{{d.dia}}" value="{{ d.pix }}"></td>
    <td><input name="credito{{d.dia}}" value="{{ d.credito }}"></td>
    <td><input name="debito{{d.dia}}" value="{{ d.debito }}"></td>
    <td><input name="sangria{{d.dia}}" value="{{ d.sangria }}"></td>

    <td>{{ d.total }}</td>
</tr>
{% endfor %}

</table>

<div style="text-align:center;">
    <button type="submit">💾 Salvar Tudo</button>
</div>

</form>

</body>
</html>

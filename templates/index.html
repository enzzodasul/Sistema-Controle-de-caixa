<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Caixa Mensal</title>

<style>
body {
    font-family: Arial;
    background: #1e1e2f;
    color: white;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #2c2c3e;
}

th, td {
    border: 1px solid #444;
    padding: 8px;
    text-align: center;
}

th {
    background: #444;
}

input {
    width: 90px;
    padding: 5px;
    border-radius: 5px;
    border: none;
}

button {
    margin: 20px;
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

</head>
<body>

<h1>📊 Controle de Caixa - Abril</h1>

<form method="POST" action="/salvar">

<table>
<tr>
    <th>Dia</th>
    <th>Data</th>
    <th>Dinheiro</th>
    <th>Pix</th>
    <th>Crédito</th>
    <th>Débito</th>
    <th>Sangria</th>
    <th>Total</th>
</tr>

{% for i in range(1, 31) %}
<tr>
    <td>{{ i }}</td>
    <td>0{{ i }}/04</td>

    <td><input name="dinheiro{{i}}" type="number" step="0.01"></td>
    <td><input name="pix{{i}}" type="number" step="0.01"></td>
    <td><input name="credito{{i}}" type="number" step="0.01"></td>
    <td><input name="debito{{i}}" type="number" step="0.01"></td>
    <td><input name="sangria{{i}}" type="number" step="0.01"></td>

    <td>--</td>
</tr>
{% endfor %}

</table>

<div style="text-align:center;">
    <button type="submit">💾 Salvar Mês</button>
</div>

</form>

</body>
</html>
